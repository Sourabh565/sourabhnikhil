spring.application.name=Sourabh

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/college_attendance
spring.datasource.username=root
spring.datasource.password=sourabhpatel
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=collegeAttendanceSecretKey123456789
jwt.expiration=86400000

# File Storage Path
file.storage.path=./uploads

# SpringDoc/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
